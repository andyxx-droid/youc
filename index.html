<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouC</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#F7F6F2"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="YouC"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      height:100%;
      width:100%;
      background:#F7F6F2;
      font-family:system-ui,-apple-system,sans-serif;
      overflow:hidden;
    }

    #app{
      display:flex;
      flex-direction:column;
      height:100vh;
      width:100vw;
      padding:12px;
    }

    /* ── GRIGLIA ── */
    .grid{
      display:grid;
      grid-template-columns:repeat(12, 14px minmax(0,1fr));
      gap:0 1px;
      border:1px solid #1A1A18;
      border-radius:10px;
      overflow:hidden;
      background:#1A1A18;
      flex:1;
    }

    /* Le celle si espandono per riempire l'altezza disponibile */
    .cell{
      background:#fff;
      border-right:none;
      border-bottom:0.5px solid #ccc;
      position:relative;
      overflow:hidden;
      min-height:0;
    }
    .cell.week-sep{border-top:1.5px dashed #1A1A18}

    .ch{
      background:#f5f5f3;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:600;color:#1A1A18;
      padding:5px 2px;letter-spacing:.2px;text-transform:uppercase;
      grid-column:span 2;
      border-bottom:1px solid #1A1A18;
    }
    .ch.past{background:#A8A79F;color:#fff}
    .ch.current{background:#E53935;color:#fff}

    .cd{
      background:#f5f5f3;
      display:flex;align-items:center;justify-content:center;
      font-size:9px;color:#1A1A18;
      border-right:none;
      border-bottom:0.5px solid #ccc;
      line-height:1;
    }
    .cd.sat{background:#A8A79F;color:#fff}
    .cd.sun{background:#1A1A18;color:#fff}
    .cd.holiday{background:#1A1A18;color:#fff}
    .cd.today{background:#E53935 !important;color:#fff !important}
    .cd.noscuola{background:#FFDDDD;color:#1A1A18}
    .cell.past-day{background:#E4E4E2}
    .cd.week-sep{border-top:1.5px dashed #1A1A18}

    .cell-empty{
      grid-column:span 2;
      background:#f7f6f2;
      border-right:none;
      border-bottom:none;
    }
    .cell-empty.last-empty{border-bottom:0.5px solid #ebebeb}

    .dc{cursor:default}
    .dc:hover{filter:brightness(0.96)}

    .hstrip{
      height:10px;border-radius:3px;
      position:absolute;
      display:flex;align-items:center;
      padding:0 3px;overflow:hidden;
    }
    .hstrip-lbl{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}

    /* ── LOADING / AUTH ── */
    #overlay{
      position:fixed;inset:0;
      background:#F7F6F2;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:20px;z-index:1000;
    }
    #overlay h1{font-size:32px;font-weight:300;letter-spacing:4px;color:#1A1A18}
    #overlay p{font-size:13px;color:#888;text-align:center;max-width:320px;line-height:1.6}
    .btn{
      background:#1A1A18;color:#fff;
      border:none;border-radius:8px;
      padding:10px 24px;font-size:13px;
      cursor:pointer;letter-spacing:.5px;
      transition:opacity .15s;
    }
    .btn:hover{opacity:.8}
    .btn.secondary{background:#f5f5f3;color:#1A1A18;border:0.5px solid #ccc}
    .spinner{
      width:20px;height:20px;
      border:2px solid #e0e0e0;
      border-top-color:#1A1A18;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── TOOLTIP ── */
    #tt{
      background:#fff;border:1px solid #1A1A18;border-radius:10px;
      padding:8px 12px;font-size:11px;
      display:none;max-width:230px;
      pointer-events:none;
      position:fixed;z-index:99;
      box-shadow:0 4px 16px rgba(0,0,0,.1);
    }
    .ttd{font-weight:500;margin-bottom:5px;color:#1A1A18}
    .tte{color:#666;padding:3px 0;border-bottom:0.5px solid #eee;display:flex;gap:5px;align-items:center}
    .tte:last-child{border-bottom:none}
    .ttdot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
    .ttt{font-size:10px;color:#aaa;flex-shrink:0}


    /* ── POPUP EVENTO ── */
    #ev-popup{
      display:none;position:fixed;inset:0;z-index:500;
      background:rgba(0,0,0,.45);
      align-items:center;justify-content:center;
    }
    #ev-popup.open{display:flex;}
    #ev-form{
      background:#fff;border-radius:12px;
      padding:24px;width:min(420px,92vw);
      box-shadow:0 8px 40px rgba(0,0,0,.18);
      display:flex;flex-direction:column;gap:14px;
    }
    #ev-form h2{font-size:15px;font-weight:600;color:#1A1A18;margin:0}
    #ev-form label{font-size:11px;color:#888;margin-bottom:3px;display:block}
	#ev-form input[type=text] {
	  width:100%;border:0.5px solid #ccc;border-radius:6px;
	  padding:7px 10px;font-size:16px;font-family:inherit;
	  outline:none;color:#1A1A18;background:#fff;
	  box-sizing:border-box;
	  font-weight:bold;
	}
	#ev-form input[type=date],
	#ev-form input[type=time],
	#ev-form textarea,
	#ev-form select{
	  width:100%;border:0.5px solid #ccc;border-radius:6px;
	  padding:7px 10px;font-size:13px;font-family:inherit;
	  outline:none;color:#1A1A18;background:#fff;
	  box-sizing:border-box;
	}
	#ev-form textarea{resize:vertical;min-height:60px}
    #ev-form input:focus,#ev-form textarea:focus,#ev-form select:focus{border-color:#1A1A18}
    .ev-row{display:flex;gap:10px}
    .ev-row>div{flex:1}
    .ev-allday-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#1A1A18}
    .ev-allday-row input[type=checkbox]{width:16px;height:16px;cursor:pointer}
    .ev-actions{display:flex;gap:8px;margin-top:4px}
    .ev-btn{
      flex:1;border:none;border-radius:6px;padding:9px;
      font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;
      transition:opacity .15s;
    }
    .ev-btn:hover{opacity:.82}
    .ev-btn.save{background:#1A1A18;color:#fff}
    .ev-btn.del{background:#E53935;color:#fff;flex:0 0 auto;padding:9px 16px}
    .ev-btn.cancel{background:#f5f5f3;color:#1A1A18;border:0.5px solid #ccc}
    .ev-color-row{display:flex;gap:6px;flex-wrap:wrap}
    #ev-saving{font-size:11px;color:#888;text-align:center;min-height:16px}

    /* ── RIGA TITOLO + SWATCH CATEGORIA ── */
    .ev-title-row{
      display:flex;align-items:center;gap:8px;position:relative;
    }
    .ev-title-row input[type=text]{flex:1}
    #ev-cat-swatch{
      width:32px;height:32px;border-radius:6px;flex-shrink:0;
      cursor:pointer;border:1.5px solid rgba(0,0,0,.12);
      transition:transform .12s,box-shadow .12s;
    }
    #ev-cat-swatch:hover{transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,.18)}
    #ev-cat-dropdown{
      display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:600;
      background:#fff;border:1px solid #ddd;border-radius:10px;
      box-shadow:0 6px 24px rgba(0,0,0,.15);padding:6px;
      min-width:180px;
    }
    #ev-cat-dropdown.open{display:block}
    .ev-cat-opt{
      display:flex;align-items:center;gap:10px;
      padding:7px 10px;border-radius:6px;cursor:pointer;
      font-size:13px;color:#1A1A18;transition:background .1s;
    }
    .ev-cat-opt:hover{background:#f5f5f3}
    .ev-cat-opt.selected{background:#f0f0ee;font-weight:600}
    .ev-cat-dot{
      width:20px;height:20px;border-radius:4px;flex-shrink:0;
      border:1px solid rgba(0,0,0,.1);
    }

    /* ── TIME PICKER ── */
    .time-display{
      width:100%;border:0.5px solid #ccc;border-radius:6px;
      padding:7px 10px;font-size:13px;font-family:inherit;
      color:#1A1A18;background:#fff;box-sizing:border-box;
      cursor:pointer;text-align:left;
      transition:border-color .15s;
    }
    .time-display:hover{border-color:#1A1A18}
    .time-picker-wrap{position:relative}

    /* ── TIME PICKER MODAL (drum-roll) ── */
    #tp-modal{
      display:none;position:fixed;inset:0;z-index:900;
      background:rgba(0,0,0,.5);
      align-items:flex-end;justify-content:center;
    }
    #tp-modal.open{display:flex}
    #tp-modal-box{
      background:#fff;border-radius:20px 20px 0 0;
      padding:0 0 28px;
      width:min(480px,100vw);
      box-shadow:0 -4px 32px rgba(0,0,0,.18);
      display:flex;flex-direction:column;
    }
    #tp-modal-header{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 20px 12px;
      border-bottom:0.5px solid #eee;
    }
    #tp-modal-title{
      font-size:12px;font-weight:600;color:#888;
      text-transform:uppercase;letter-spacing:.8px;margin:0;
    }
    .tp-header-btn{
      border:none;background:none;font-size:14px;font-family:inherit;
      cursor:pointer;padding:4px 8px;border-radius:6px;font-weight:600;
      transition:background .12s;
    }
    .tp-header-btn.cancel{color:#888}
    .tp-header-btn.confirm{color:#1A1A18}
    .tp-header-btn:hover{background:#f0f0ee}

    /* drum picker body */
    #tp-drums{
      display:flex;align-items:center;justify-content:center;
      gap:0;padding:0 20px;position:relative;
      height:210px;
      overflow:hidden;
    }
    /* selection highlight band */
    #tp-drums::before{
      content:'';position:absolute;
      left:20px;right:20px;
      top:50%;transform:translateY(-50%);
      height:52px;margin-top:-2px;
      background:rgba(26,26,24,.07);
      border-radius:10px;
      pointer-events:none;
      z-index:1;
    }
    /* fade top/bottom */
    #tp-drums::after{
      content:'';position:absolute;inset:0;
      background:linear-gradient(
        to bottom,
        #fff 0%,#fff 5%,
        transparent 28%,
        transparent 72%,
        #fff 95%,#fff 100%
      );
      pointer-events:none;z-index:2;
    }
    .tp-drum{
      flex:1;height:100%;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      -ms-overflow-style:none;
    }
    .tp-drum::-webkit-scrollbar{display:none}
    .tp-drum-label{
      text-align:center;font-size:11px;font-weight:600;
      color:#aaa;letter-spacing:.8px;text-transform:uppercase;
      padding:4px 0 8px;
    }
    .tp-drum-item{
      height:52px;
      display:flex;align-items:center;justify-content:center;
      font-size:28px;font-weight:300;color:#1A1A18;
      font-variant-numeric:tabular-nums;
      scroll-snap-align:center;
      cursor:pointer;
      user-select:none;
    }
    .tp-drum-sep{
      font-size:32px;font-weight:200;color:#ccc;
      padding:0 4px;flex-shrink:0;padding-top:52px; /* align with items */
    }
    /* spacer sopra/sotto per centrare primo/ultimo item */
    .tp-drum-spacer{height:79px;flex-shrink:0}

    .tp-modal-labels{
      display:flex;gap:0;padding:0 20px;margin-top:-4px;
    }
    .tp-modal-label{flex:1;text-align:center;font-size:11px;font-weight:600;color:#aaa;letter-spacing:.6px;text-transform:uppercase}

    /* ── TOAST notifica aggiornamento ── */
    #toast{
      position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
      background:#1A1A18;color:#fff;
      border-radius:8px;padding:8px 16px;font-size:12px;
      opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;
    }
    #toast.show{opacity:1}

    /* ── MENU OVERLAY ── */
    #menu-overlay{
      position:fixed;inset:0;z-index:800;
      background:rgba(0,0,0,0);
      pointer-events:none;
      transition:background .25s;
    }
    #menu-overlay.open{
      background:rgba(0,0,0,.38);
      pointer-events:all;
    }
    #menu-panel{
      position:absolute;
      top:0;left:0;right:0;
      background:#F7F6F2;
      border-radius:0 0 16px 16px;
      box-shadow:0 8px 32px rgba(0,0,0,.18);
      padding:28px 24px 24px;
      display:flex;flex-direction:column;gap:6px;
      transform:translateY(-110%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      max-width:480px;
      margin:0 auto;
    }
    #menu-overlay.open #menu-panel{
      transform:translateY(0);
    }
    .menu-app-title{
      font-size:26px;font-weight:300;letter-spacing:4px;color:#1A1A18;
      margin-bottom:2px;
    }
    .menu-app-sub{
      font-size:10px;color:#aaa;letter-spacing:2px;text-transform:uppercase;
      margin-bottom:2px;
    }
    .menu-meta{
      font-size:11px;color:#bbb;letter-spacing:.4px;margin-bottom:14px;
    }
    .menu-divider{
      height:1px;background:#e8e8e4;margin:6px 0;
    }
    .menu-btn{
      display:flex;align-items:center;gap:12px;
      background:none;border:none;border-radius:10px;
      padding:12px 14px;cursor:pointer;
      font-size:14px;font-family:inherit;color:#1A1A18;
      text-align:left;width:100%;
      transition:background .13s;
    }
    .menu-btn:hover,.menu-btn:active{background:#eceae4}
    .menu-btn-icon{
      width:32px;height:32px;border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;font-size:17px;
    }
    .menu-btn-icon.reset{background:#1A1A18;color:#fff}
    .menu-btn-icon.refresh{background:#1A1A18;color:#fff}
    .menu-btn-icon.setup{background:#1A1A18;color:#fff}
    .menu-btn-label{flex:1;font-weight:500}
    .menu-btn-desc{font-size:11px;color:#aaa;font-weight:400;margin-top:1px}
    .menu-close{
      position:absolute;top:14px;right:16px;
      background:none;border:none;font-size:20px;cursor:pointer;
      color:#aaa;padding:4px 8px;border-radius:6px;
      transition:background .12s,color .12s;
    }
    .menu-close:hover{background:#eceae4;color:#1A1A18}
  </style>
</head>
<body>

<!-- Overlay di caricamento -->
<div id="overlay">
  <h1>YouC</h1>
  <p style="font-size:11px;color:#aaa;letter-spacing:2px;text-transform:uppercase;margin-top:-14px">Year Oriented Universal Calendar</p>
  <p id="overlay-msg">Caricamento...</p>
  <p id="overlay-version" style="font-size:10px;color:#bbb;letter-spacing:.5px;margin-top:-10px"></p>
  <p style="font-size:11px;color:#bbb;letter-spacing:.5px">Andrea Xotta</p>
</div>

<!-- Contenitore One Tap (Google lo popola automaticamente) -->
<div id="g_id_onload"
  data-client_id=""
  data-auto_select="true"
  data-callback="onOneTapCredential"
  data-cancel_on_tap_outside="false">
</div>

<div id="app" style="display:none">
  <div class="grid" id="grid"></div>
</div>

<div id="tt"></div>
<div id="toast" id="toast"></div>

<!-- Popup scelta evento -->
<div id="pick-popup" style="display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;">
  <div id="pick-box" style="background:#fff;border-radius:12px 12px 0 0;padding:20px;width:100%;max-width:500px;box-shadow:0 -4px 24px rgba(0,0,0,.15);">
    <h2 style="font-size:13px;font-weight:600;color:#888;margin:0 0 12px;text-transform:uppercase;letter-spacing:.5px">Quale evento modificare?</h2>
    <div id="pick-events"></div>
    <button onclick="closePickPopup()" style="margin-top:14px;width:100%;border:none;border-radius:8px;padding:10px;background:#f5f5f3;font-size:14px;cursor:pointer;font-family:inherit;color:#1A1A18">Annulla</button>
  </div>
</div>

<!-- Popup inserimento/modifica evento -->
<div id="ev-popup">
    <div id="ev-form">
    <h2 id="ev-title-label">Nuovo evento</h2>
    <div id="ev-color-wrap">
      <label id="ev-cat-label" style="color:#1A1A18">Titolo</label>
      <div class="ev-title-row">
        <!-- Quadrato categoria cliccabile -->
        <div id="ev-cat-swatch" title="Cambia categoria"></div>
        <!-- Dropdown custom categoria -->
        <div id="ev-cat-dropdown">
          <!-- popolato da buildColorSelect() -->
        </div>
        <input type="text" id="ev-title" placeholder="Aggiungi titolo"/>
      </div>
    </div>
    <div>
      <label>Descrizione</label>
      <textarea id="ev-desc" placeholder="Aggiungi descrizione"></textarea>
    </div>
    <div class="ev-allday-row">
      <input type="checkbox" id="ev-allday" checked onchange="toggleAllDay()"/>
      <label for="ev-allday" style="margin:0;font-size:13px;cursor:pointer">Tutto il giorno</label>
    </div>
    <div class="ev-row">
      <div>
        <label>Data inizio</label>
        <input type="date" id="ev-start-date"/>
      </div>
      <div id="ev-start-time-wrap" style="display:none">
        <label>Ora inizio</label>
        <div class="time-picker-wrap" id="tp-start">
          <button type="button" class="time-display" id="ev-start-display" onclick="openTimePicker('start')">09:00</button>
          <select id="ev-start-h" style="display:none"></select>
          <select id="ev-start-m" style="display:none"></select>
        </div>
      </div>
    </div>
    <div class="ev-row">
      <div>
        <label>Data fine</label>
        <input type="date" id="ev-end-date"/>
      </div>
      <div id="ev-end-time-wrap" style="display:none">
        <label>Ora fine</label>
        <div class="time-picker-wrap" id="tp-end">
          <button type="button" class="time-display" id="ev-end-display" onclick="openTimePicker('end')">10:00</button>
          <select id="ev-end-h" style="display:none"></select>
          <select id="ev-end-m" style="display:none"></select>
        </div>
      </div>
    </div>
    <div>
      <label>Calendario</label>
      <select id="ev-cal"></select>
    </div>
    <div id="ev-saving"></div>
    <div class="ev-actions">
      <button class="ev-btn cancel" onclick="closePopup()">Annulla</button>
      <button class="ev-btn del" id="ev-del-btn" onclick="deleteEvent()" style="display:none">Elimina</button>
      <button class="ev-btn save" onclick="saveEvent()">Salva</button>
    </div>
  </div>
</div>

<!-- Time Picker Modal -->
<!-- Time Picker Modal (drum-roll) -->
<div id="tp-modal">
  <div id="tp-modal-box">
    <div id="tp-modal-header">
      <button class="tp-header-btn cancel" onclick="closeTimePicker(false)">Annulla</button>
      <p id="tp-modal-title">Seleziona ora</p>
      <button class="tp-header-btn confirm" onclick="closeTimePicker(true)">OK</button>
    </div>
    <div class="tp-modal-labels">
      <span class="tp-modal-label">Ore</span>
      <span style="width:24px;flex-shrink:0"></span>
      <span class="tp-modal-label">Minuti</span>
    </div>
    <div id="tp-drums">
      <div class="tp-drum" id="tp-drum-h"></div>
      <div class="tp-drum-sep">:</div>
      <div class="tp-drum" id="tp-drum-m"></div>
    </div>
  </div>
</div>

<!-- Menu overlay -->
<div id="menu-overlay">
  <div id="menu-panel" role="dialog" aria-modal="true" aria-label="Menu">
    <button class="menu-close" onclick="closeMenu()" aria-label="Chiudi menu">✕</button>
    <div class="menu-app-title">YouC</div>
    <div class="menu-app-sub">Year Oriented Universal Calendar</div>
    <div class="menu-meta" id="menu-version-line"><!-- popolato da JS --></div>
    <div class="menu-divider"></div>
    <button class="menu-btn" onclick="menuResetView()">
      <div class="menu-btn-icon reset">⌂</div>
      <div>
        <div class="menu-btn-label">Vista iniziale</div>
        <div class="menu-btn-desc">Torna alla visualizzazione di partenza</div>
      </div>
    </button>
    <button class="menu-btn" onclick="menuRefresh()">
      <div class="menu-btn-icon refresh">↺</div>
      <div>
        <div class="menu-btn-label">Aggiorna</div>
        <div class="menu-btn-desc">Ricarica il sorgente dal server</div>
      </div>
    </button>
    <button class="menu-btn" onclick="menuSetup()">
      <div class="menu-btn-icon setup">⚙</div>
      <div>
        <div class="menu-btn-label">Impostazioni</div>
        <div class="menu-btn-desc">Configura l'applicazione</div>
      </div>
    </button>
  </div>
</div>

<!-- Google API -->
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://accounts.google.com/gsi/client"></script>

<script>
// ══════════════════════════════════════════════════════════════
// VERSIONE
// ══════════════════════════════════════════════════════════════
const APP_VERSION = 'v11b.260610-1538';

// ══════════════════════════════════════════════════════════════
// AUTH GOOGLE — One Tap + GIS Token Flow (PWA Android)
//
// Flusso:
//  1. Access token valido in localStorage → carica subito (zero UI)
//  2. Token scaduto ma hint noto → GIS refresh silenzioso (zero UI)
//  3. Primo avvio → One Tap: banner "Continua come X" (1 tap)
//     oppure fallback GIS con account pre-selezionato
// ══════════════════════════════════════════════════════════════

let _tokenClient = null;       // GIS tokenClient (creato una sola volta)
let _oneTapReady = false;      // true quando GIS è pronto
let _oneTapResolve = null;     // resolver della Promise in attesa di One Tap

// ── Salva token ───────────────────────────────────────────────
function storeTokens({ access_token, expires_in }) {
  tokenExpiresAt = Date.now() + (expires_in || 3600) * 1000 - 60000;
  localStorage.setItem('youc_token',     access_token);
  localStorage.setItem('youc_token_exp', String(tokenExpiresAt));
  gapi.client.setToken({ access_token });
}

// ── Callback globale chiamata da One Tap quando l'utente sceglie l'account ──
window.onOneTapCredential = function(credentialResponse) {
  // credentialResponse.credential è un id_token JWT
  // Estraiamo l'email dal payload (base64) per salvarlo come hint
  try {
    const payload = JSON.parse(atob(credentialResponse.credential.split('.')[1]));
    if (payload.email) localStorage.setItem('youc_login_hint', payload.email);
  } catch(e) {}

  // Ora che Google sa chi siamo, chiediamo l'access token silenziosamente
  if (_oneTapResolve) { _oneTapResolve(); _oneTapResolve = null; }
};

// ── Crea tokenClient (una sola volta) ────────────────────────
function getTokenClient(hint) {
  // Ricrea sempre con hint aggiornato
  _tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope:     CONFIG.SCOPES,
    hint:      hint || undefined,
    callback:  () => {} // sovrascritta al momento dell'uso
  });
  return _tokenClient;
}

// ── Richiede access token a GIS (silenzioso se hint noto) ────
function requestToken(hint, prompt) {
  return new Promise((resolve, reject) => {
    const client = getTokenClient(hint);
    client.callback = (resp) => {
      if (resp.error) { reject(new Error(resp.error)); return; }
      storeTokens(resp);
      resolve(resp.access_token);
    };
    client.requestAccessToken({ prompt: prompt || '' });
  });
}

// ── Assicura token valido prima di ogni chiamata API ─────────
async function ensureToken() {
  if (Date.now() < tokenExpiresAt) return;
  const hint = localStorage.getItem('youc_login_hint');
  // Refresh silenzioso: GIS usa i cookie Chrome per rinnovare senza UI
  await requestToken(hint, '');
}

// ── Avvio autenticazione ─────────────────────────────────────
async function startAuth() {
  await new Promise(resolve => gapi.load('client', resolve));
  await gapi.client.init({
    apiKey: CONFIG.API_KEY,
    discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest']
  });

  const hint     = localStorage.getItem('youc_login_hint');
  const saved    = localStorage.getItem('youc_token');
  const savedExp = parseInt(localStorage.getItem('youc_token_exp') || '0', 10);

  // 1. Access token ancora valido → carica subito
  if (saved && Date.now() < savedExp) {
    tokenExpiresAt = savedExp;
    gapi.client.setToken({ access_token: saved });
    hideOverlay();
    await loadAllData();
    startAutoRefresh();
    return;
  }

  // 2. Hint noto → refresh silenzioso tramite GIS (usa cookie Chrome)
  if (hint) {
    try {
      await requestToken(hint, '');
      hideOverlay();
      await loadAllData();
      startAutoRefresh();
      return;
    } catch(e) {
      // Sessione Chrome scaduta → procedi con One Tap
      console.warn('[Auth] silent refresh fallito, uso One Tap');
    }
  }

  // 3. Prima volta (o sessione scaduta): One Tap
  // Imposta client_id nel tag g_id_onload e attiva One Tap
  document.getElementById('g_id_onload').dataset.client_id = CONFIG.CLIENT_ID;

  // Attende che One Tap completi (l'utente vede il banner e fa tap)
  // oppure timeout 8s → fallback a selezione manuale
  await new Promise((resolve) => {
    _oneTapResolve = resolve;
    google.accounts.id.initialize({
      client_id:    CONFIG.CLIENT_ID,
      callback:     window.onOneTapCredential,
      auto_select:  true,
      cancel_on_tap_outside: false,
    });
    google.accounts.id.prompt((notification) => {
      // Se One Tap non è disponibile (bloccato, già usato, ecc.) risolvi subito
      if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
        resolve();
      }
    });
    // Timeout di sicurezza
    setTimeout(resolve, 8000);
  });

  // Ora chiediamo l'access token: con hint ora disponibile dovrebbe essere silenzioso
  const hintNow = localStorage.getItem('youc_login_hint');
  try {
    await requestToken(hintNow, '');
  } catch(e) {
    // Ultimo fallback: mostra selettore account (solo se tutto il resto fallisce)
    await requestToken(null, 'select_account');
  }

  // Salva email se non ancora fatto
  if (!localStorage.getItem('youc_login_hint')) {
    try {
      const ui = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
        headers: { Authorization: 'Bearer ' + localStorage.getItem('youc_token') }
      });
      if (ui.ok) {
        const info = await ui.json();
        if (info.email) localStorage.setItem('youc_login_hint', info.email);
      }
    } catch(e) {}
  }

  hideOverlay();
  await loadAllData();
  startAutoRefresh();
}

function showOverlay(msg) {
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('overlay-msg').textContent = msg;
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

// CARICAMENTO DATI DA GOOGLE CALENDAR
// ══════════════════════════════════════════════════════════════
async function loadAllData() {
  const months = getWindowMonths();
  const years  = [...new Set(months.map(m => m.y))];

  const allEvents   = [];
  const allHolidays = {};

  const allNoScuola = new Set();

  for (const year of years) {
    const [evts, hols, ns] = await Promise.all([
      fetchEvents(year),
      fetchHolidays(year),
      fetchNoScuola(year)
    ]);
    allEvents.push(...evts);
    Object.assign(allHolidays, hols);
    ns.forEach(d => allNoScuola.add(d));
  }

  EVENTS   = allEvents;
  HOLIDAYS = allHolidays;
  NOSCUOLA = allNoScuola;
  build();
}

async function fetchEvents(year) {
  try {
    await ensureToken();
    const resp = await gapi.client.calendar.events.list({
      calendarId:   CONFIG.CALENDAR_ID,
      timeMin:      `${year}-01-01T00:00:00+01:00`,
      timeMax:      `${year}-12-31T23:59:59+01:00`,
      singleEvents: true,
      orderBy:      'startTime',
      maxResults:   2500,
    });
    return parseEvents(resp.result.items || []);
  } catch(e) {
    console.warn('fetchEvents error:', e);
    return [];
  }
}

async function findNoScuolaCalId() {
  if (noscuolaCalId) return noscuolaCalId;
  try {
    await ensureToken();
    const resp = await gapi.client.calendar.calendarList.list();
    const cal = (resp.result.items || []).find(c =>
      c.summary && c.summary.toLowerCase().replace(/\s/g,'').includes('noscuola')
    );
    noscuolaCalId = cal ? cal.id : null;
  } catch(e) { noscuolaCalId = null; }
  return noscuolaCalId;
}

async function fetchNoScuola(year) {
  const calId = await findNoScuolaCalId();
  if (!calId) return new Set();
  try {
    const resp = await gapi.client.calendar.events.list({
      calendarId:   calId,
      timeMin:      `${year}-01-01T00:00:00+01:00`,
      timeMax:      `${year}-12-31T23:59:59+01:00`,
      singleEvents: true,
      orderBy:      'startTime',
      maxResults:   500,
    });
    const dates = new Set();
    (resp.result.items || []).forEach(ev => {
      if (ev.start.date) {
        // evento tutto il giorno: espandi il range
        let cur = new Date(ev.start.date);
        const end = new Date(ev.end.date); // end esclusivo
        while (cur < end) {
          dates.add(cur.toISOString().slice(0,10));
          cur.setDate(cur.getDate()+1);
        }
      } else {
        dates.add(ev.start.dateTime.slice(0,10));
      }
    });
    return dates;
  } catch(e) { return new Set(); }
}

async function fetchHolidays(year) {
  try {
    await ensureToken();
    const resp = await gapi.client.calendar.events.list({
      calendarId:   CONFIG.HOLIDAYS_CAL,
      timeMin:      `${year}-01-01T00:00:00+01:00`,
      timeMax:      `${year}-12-31T23:59:59+01:00`,
      singleEvents: true,
      orderBy:      'startTime',
      maxResults:   100,
    });
    const map = {};
    (resp.result.items || []).forEach(ev => {
      const date = ev.start.date || ev.start.dateTime?.slice(0,10);
      if (date) map[date] = ev.summary || null;
    });
    return map;
  } catch(e) { return {}; }
}

function parseEvents(items) {
  const result = [];
  items.forEach(ev => {
    let start, end;
    if (ev.start.date) {
      // Evento tutto il giorno: end è esclusivo, sottraiamo 1 giorno
      start = ev.start.date;
      const endDate = new Date(ev.end.date);
      endDate.setDate(endDate.getDate() - 1);
      end = endDate.toISOString().slice(0,10);
    } else {
      start = ev.start.dateTime.slice(0,10);
      end   = ev.end.dateTime.slice(0,10);
    }

    // Recupera colorId dall'evento o dal calendario
    const colorId = parseInt(ev.colorId || '0') || null;
    const color   = colorId ? (GC[colorId] || GC.def) : GC.def;

    // Orario
    const time = ev.start.dateTime
      ? ev.start.dateTime.slice(11,16)
      : null;

    result.push({
      id:          ev.id,
      title:       ev.summary || '(senza titolo)',
      description: ev.description || '',
      color,
      colorId:     colorId,
      start,
      end,
      time,
      timeEnd:     ev.end.dateTime ? ev.end.dateTime.slice(11,16) : null,
      isMulti:     start !== end,
      startMs:     isoToMs(start),
      endMs:       isoToMs(end),
      calendarId:  CONFIG.CALENDAR_ID,
    });
  });
  return result;
}

// Aggiornamento automatico ogni 5 minuti
function startAutoRefresh() {
  setInterval(async () => {
    await loadAllData();
    showToast('Calendario aggiornato');
  }, 5 * 60 * 1000);

  // Rinnovo preventivo del token ogni 45 minuti (scade a 60)
  setInterval(async () => {
    try {
      tokenExpiresAt = 0; // forza il rinnovo
      await ensureToken();
    } catch(e) { console.warn('[Auth] token refresh periodico fallito:', e); }
  }, 45 * 60 * 1000);
}

// ══════════════════════════════════════════════════════════════
// LOGICA CALENDARIO
// ══════════════════════════════════════════════════════════════
const SLOT_W=9, STRIP_H=8, GAP=1, DAY=86400000;

function isoToMs(s){const[y,m,d]=s.split('-');return new Date(+y,+m-1,+d).getTime();}
function msToKey(ms){const d=new Date(ms);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtDate(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function dim(m,y){return new Date(y,m+1,0).getDate();}
function monthLabel(y,m){return `${MS[m]}'${String(y).slice(-2)}`;}

function getWindowMonths(){
  const months=[];
  for(let i=0;i<windowSize;i++){const abs=windowStart+i;months.push({y:Math.floor(abs/12),m:abs%12});}
  return months;
}

function assignSlots(events){
  const multi=events.filter(e=>e.isMulti).sort((a,b)=>a.startMs-b.startMs);
  const slotEnds=[];
  multi.forEach(ev=>{
    let s=0;
    while(slotEnds[s]!==undefined&&slotEnds[s]>ev.startMs)s++;
    ev.slot=s;
    slotEnds[s]=ev.endMs+DAY;
  });
}

function buildCellData(months){
  const years=new Set(months.map(({y})=>y));
  const evs=EVENTS.filter(ev=>{
    const sy=new Date(ev.startMs).getFullYear();
    const ey=new Date(ev.endMs).getFullYear();
    return years.has(sy)||years.has(ey);
  }).map(ev=>({...ev}));
  assignSlots(evs);

  const cellData={};
  evs.forEach(ev=>{
    let cur=ev.startMs;
    while(cur<=ev.endMs){
      const d=new Date(cur);
      if(years.has(d.getFullYear())){
        const key=msToKey(cur);
        if(!cellData[key])cellData[key]={slots:{},singles:[],all:[]};
        const isStart=cur===ev.startMs,isEnd=cur===ev.endMs;
        const pos=isStart&&isEnd?'solo':isStart?'start':isEnd?'end':'mid';
        const entry={...ev,pos,slot:ev.slot??null};
        if(ev.isMulti)cellData[key].slots[ev.slot]=entry;
        else cellData[key].singles.push(entry);
        cellData[key].all.push(entry);
      }
      cur+=DAY;
    }
  });
  return cellData;
}

// ══════════════════════════════════════════════════════════════
// RENDERING
// ══════════════════════════════════════════════════════════════
function buildEventCell(dk,holidayName,isWeekSep,cellData,CELL_H){
  const c=document.createElement('div');
  c.className='cell dc';
  if(isWeekSep)c.classList.add('week-sep');
  c.dataset.dk=dk;
  const cd=cellData[dk];
  const slotsObj=cd?cd.slots:{};
  const singles=cd?cd.singles:[];
  const slotKeys=Object.keys(slotsObj).map(Number);
  const startMulti=slotKeys.map(s=>slotsObj[s]).filter(e=>e.pos==='start');
  const maxSlot=slotKeys.length>0?Math.max(...slotKeys):-1;
  const singlesLeft=maxSlot>=0?(1+(maxSlot+1)*SLOT_W+1):1;
  const hstrips=[];
  if(holidayName)hstrips.push({ev:{title:holidayName,color:{bg:'#1A1A18',fg:'#fff'},isMulti:false,slot:null},leftPx:singlesLeft});
  startMulti.forEach(ev=>hstrips.push({ev,leftPx:1+ev.slot*SLOT_W}));
  singles.forEach(ev=>hstrips.push({ev,leftPx:singlesLeft}));
  const total=hstrips.length;
  const totalH=total*(STRIP_H+GAP)-GAP;
  const startTop=Math.max(2,Math.round((CELL_H-totalH)/2));
  const slotTopMap={};
  hstrips.forEach(({ev},i)=>{if(ev.isMulti&&ev.slot!=null)slotTopMap[ev.slot]=startTop+i*(STRIP_H+GAP);});
  slotKeys.forEach(s=>{
    const ev=slotsObj[s];
    const strip=document.createElement('div');
    const left=1+s*SLOT_W;
    strip.style.cssText=`position:absolute;left:${left}px;width:8px;background:${ev.color.bg};z-index:10;`;
    if(ev.pos==='start'){const top=slotTopMap[s]??startTop;strip.style.top=top+'px';strip.style.bottom='-1px';strip.style.borderRadius='4px 4px 0 0';}
    else if(ev.pos==='end'){strip.style.top='-1px';strip.style.bottom='2px';strip.style.borderRadius='0 0 4px 4px';}
    else if(ev.pos==='solo'){const top=slotTopMap[s]??startTop;strip.style.top=top+'px';strip.style.bottom=(CELL_H-top-STRIP_H)+'px';strip.style.borderRadius='4px';}
    else{strip.style.top='-1px';strip.style.bottom='-1px';}
    c.appendChild(strip);
  });
  hstrips.slice(0,3).forEach(({ev,leftPx},i)=>{
    const top=startTop+i*(STRIP_H+GAP);
    const hs=document.createElement('div');
    hs.className='hstrip';
    hs.style.cssText=`left:${leftPx}px;right:1px;top:${top}px;background:${ev.color.bg};z-index:20;cursor:pointer;`;
    hs.dataset.evid=ev.id;
    const lbl=document.createElement('span');lbl.className='hstrip-lbl';lbl.style.color=ev.color.fg;lbl.textContent=ev.title;
    hs.appendChild(lbl);c.appendChild(hs);
  });
  if(total>3){
    const more=document.createElement('div');
    more.style.cssText=`position:absolute;left:${singlesLeft}px;top:${startTop+3*(STRIP_H+GAP)}px;font-size:9px;color:#aaa;z-index:20;`;
    more.textContent=`+${total-3}`;c.appendChild(more);
  }
  c.addEventListener('mouseenter',showTT);
  c.addEventListener('mouseleave',hideTT);
  c.addEventListener('mousemove',moveTT);
  c.addEventListener('click', e=>{
    // Conta le hstrip visibili nella cella (eventi con etichetta)
    const hstrips=[...c.querySelectorAll('.hstrip[data-evid]')];
    const clickedHstrip=e.target.closest('.hstrip[data-evid]');
    if(clickedHstrip){
      // Click diretto su una hstrip specifica
      if(hstrips.length>1){
        // Più etichette: apri pick popup
        openPickFromHstrips(dk, hstrips);
      } else {
        openPopup(dk, clickedHstrip.dataset.evid);
      }
    } else {
      // Click sulla cella fuori dalle hstrip
      if(hstrips.length===0){
        openPopup(dk, null); // cella vuota → nuovo evento
      } else if(hstrips.length===1){
        openPopup(dk, hstrips[0].dataset.evid); // un solo evento → modifica
      } else {
        openPickFromHstrips(dk, hstrips); // più eventi → pick
      }
    }
  });
  c.querySelectorAll('.hstrip').forEach(hs=>{ hs.style.cursor='pointer'; });
  return c;
}

function build(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  const months=getWindowMonths();
  const cellData=buildCellData(months);
  const todayAbs=td.getFullYear()*12+td.getMonth();

  // Titolo dinamico
  const first=months[0],last=months[windowSize-1];
  document.title = first.y===last.y
    ? `YouC ${first.y}`
    : `YouC ${first.y}–${last.y}`;

  // Calcola altezza cella dinamica basata sullo spazio disponibile
  // 32 righe totali (1 header + 31 giorni), meno padding app
  const appH = window.innerHeight - 24; // 24 = padding top+bottom
  const CELL_H = Math.floor(appH / 32);

  // Imposta min-height dinamica su tutte le celle tramite CSS variable
  g.style.setProperty('--ch', CELL_H+'px');
  g.style.gridTemplateColumns=`repeat(${windowSize}, 14px minmax(0,1fr))`;
  g.querySelectorAll('.cell,.cd,.cell-empty').forEach(c=>c.style.minHeight=CELL_H+'px');

  // Intestazioni mesi
  months.forEach(({y,m},i)=>{
    const abs=y*12+m;
    const h=document.createElement('div');
    h.className='cell ch';
    h.style.minHeight=CELL_H+'px';
    h.style.cursor='pointer';
    h.title='Menu';
    h.textContent=monthLabel(y,m);
    if(abs<todayAbs)h.classList.add('past');
    else if(abs===todayAbs)h.classList.add('current');
    if(m===0 && i>0)h.style.borderLeft='2px solid #1A1A18';
    h.addEventListener('click', openMenu);
    g.appendChild(h);
  });

  // Righe giorni
  for(let d=1;d<=31;d++){
    months.forEach(({y,m})=>{
      const hasDayInMonth=d<=dim(m,y);
      const dow=hasDayInMonth?new Date(y,m,d).getDay():null;
      const isWeekSep=dow===1 && d!==1;
      if(!hasDayInMonth){
        const isYearBoundaryEmpty = m===0 && months.findIndex(mo=>mo.y===y&&mo.m===0)>0;
        const empty=document.createElement('div');
        empty.className='cell-empty'+(d===31?' last-empty':'');
        if(d===31)empty.style.borderBottom='1px solid #1A1A18';
        if(isYearBoundaryEmpty)empty.style.borderLeft='2px solid #1A1A18';
        empty.style.minHeight=CELL_H+'px';
        g.appendChild(empty);
      } else {
        const dk=fmtDate(y,m,d);
        const isHoliday=dk in HOLIDAYS;
        const holidayName=isHoliday?HOLIDAYS[dk]:null;
        const isToday=td.getFullYear()===y&&td.getMonth()===m&&td.getDate()===d;
        const isYearBoundary = m===0 && months.findIndex(mo=>mo.y===y&&mo.m===0)>0;
        const dn=document.createElement('div');
        dn.className='cell cd';
        dn.style.minHeight=CELL_H+'px';
        if(isWeekSep)dn.classList.add('week-sep');
        if(isYearBoundary)dn.style.borderLeft='2px solid #1A1A18';
        const isNoScuola=NOSCUOLA.has(dk);
        const isPast=!isToday&&(y<td.getFullYear()||(y===td.getFullYear()&&m<td.getMonth())||(y===td.getFullYear()&&m===td.getMonth()&&d<td.getDate()));
        dn.textContent=d;
        if(isToday)dn.classList.add('today');
        else if(isHoliday)dn.classList.add('holiday');
        else if(dow===6)dn.classList.add('sat');
        else if(dow===0)dn.classList.add('sun');
        else if(isNoScuola)dn.classList.add('noscuola');
        const isLastDayOfMonth = d===dim(m,y);
        if(d===31 || isLastDayOfMonth){dn.style.borderBottom='1px solid #1A1A18';}
        g.appendChild(dn);
        const evCell=buildEventCell(dk,isHoliday?holidayName:null,isWeekSep,cellData,CELL_H);
        evCell.style.minHeight=CELL_H+'px';
        if(isPast)evCell.classList.add('past-day');
        if(d===31 || isLastDayOfMonth)evCell.style.borderBottom='1px solid #1A1A18';
        g.appendChild(evCell);
      }
    });
  }
}

function showTT(e){
  const c=e.currentTarget,dk=c.dataset.dk;
  const months=getWindowMonths();
  const cellData=buildCellData(months);
  const cd=cellData[dk];
  const holidayName=dk&&(dk in HOLIDAYS)?HOLIDAYS[dk]:null;
  if(!cd?.all.length&&!holidayName)return;
  const[y,m,d]=dk.split('-');
  const dobj=new Date(+y,+m-1,+d);
  const tt=document.getElementById('tt');
  const seen=new Set();
  const items=[];
  if(holidayName)items.push(`<div class="tte"><div class="ttdot" style="background:#1A1A18"></div><span>${holidayName}</span></div>`);
  if(cd?.all.length){
    cd.all.filter(ev=>{if(seen.has(ev.id))return false;seen.add(ev.id);return true;}).forEach(ev=>{
      const range=ev.isMulti?`<span class="ttt">${ev.start.slice(5).replace('-','/')}→${ev.end.slice(5).replace('-','/')}</span>`:'';
      const time=ev.time?`<span class="ttt">${ev.time}</span>`:'';
      items.push(`<div class="tte"><div class="ttdot" style="background:${ev.color.bg}"></div>${time}<span>${ev.title}</span>${range}</div>`);
    });
  }
  tt.innerHTML=`<div class="ttd">${WD[dobj.getDay()]} ${+d} ${MF[+m-1]} ${y}</div>`+items.join('');
  tt.style.display='block';
  moveTT(e);
}
function moveTT(e){
  const tt=document.getElementById('tt');
  let x=e.clientX+14,y=e.clientY+14;
  if(x+240>window.innerWidth)x=e.clientX-244;
  if(y+180>window.innerHeight)y=e.clientY-184;
  tt.style.left=x+'px';tt.style.top=y+'px';
}
function hideTT(){document.getElementById('tt').style.display='none';}

  }
});

// Ridisegna al resize finestra; su mobile gestisce cambio orientamento (±3 mesi)
(function(){
  // true = landscape, false = portrait
  function isLandscape(){ return window.innerWidth > window.innerHeight; }

  let prevLandscape = isLandscape();

  window.addEventListener('resize', ()=>{
    if(isMobile){
      const nowLandscape = isLandscape();
      if(nowLandscape !== prevLandscape){
        prevLandscape = nowLandscape;
        if(nowLandscape){
          // portrait → landscape: aggiungi 3 mesi (max 24)
          windowSize = Math.min(24, windowSize + 3);
        } else {
          // landscape → portrait: togli 3 mesi (min 1)
          windowSize = Math.max(1, windowSize - 3);
        }
        loadAllData();
        return;
      }
    }
    build();
  });
})();

// ══════════════════════════════════════════════════════════════
// NAVIGAZIONE TOUCH (Android)
// swipe dx su intestazione mesi          → ctrl+← (indietro finestra)
// swipe sx su intestazione mesi          → ctrl+→ (avanti finestra)
// swipe dx fuori intestazione            → ctrl+↑ (meno mesi)
// swipe sx fuori intestazione            → ctrl+↓ (più mesi)
// ══════════════════════════════════════════════════════════════
(function(){
  const MIN_SWIPE  = 50;   // px minimi per riconoscere uno swipe

  let touchStartX  = 0;
  let touchStartY  = 0;
  let swipeOnHeader = false; // lo swipe è partito sulla riga intestazione mesi?

  // Restituisce true se il punto (x,y) è sulla riga di intestazione dei mesi
  function isOnHeader(x, y){
    const grid = document.getElementById('grid');
    if(!grid) return false;
    const rect = grid.getBoundingClientRect();
    // La riga header è la prima riga della griglia
    // Prendiamo il primo elemento .ch per conoscerne l'altezza
    const firstCh = grid.querySelector('.ch');
    if(!firstCh) return false;
    const chRect = firstCh.getBoundingClientRect();
    return y >= chRect.top && y <= chRect.bottom && x >= rect.left && x <= rect.right;
  }

  document.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    swipeOnHeader = isOnHeader(t.clientX, t.clientY);
  }, {passive: true});

  document.addEventListener('touchend', async e=>{
    if(e.touches.length !== 0) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    // Swipe valido solo se orizzontale dominante
    if(Math.abs(dx) < MIN_SWIPE || Math.abs(dx) < Math.abs(dy)) return;

    if(swipeOnHeader){
      // Swipe sulla riga intestazione mesi → sposta finestra
      if(dx > 0){
        windowStart--;           // swipe destra → ctrl+←
      } else {
        windowStart++;           // swipe sinistra → ctrl+→
      }
      await loadAllData();
    } else {
      // Swipe fuori intestazione → cambia numero mesi
      if(dx > 0){
        if(windowSize > 1){ windowSize--; await loadAllData(); }   // ctrl+↑
      } else {
        if(windowSize < 24){ windowSize++; await loadAllData(); }  // ctrl+↓
      }
    }
  });
})();

// ── Time picker: display + drum-roll modal ───────────────────
let _tpPrefix = null;
let _tpH = 9, _tpM = 0;
let _tpScrollTimer = null;

const ITEM_H = 52; // px altezza ogni item drum

function buildTimeSelects(prefix, defaultValue){
  const [dh, dm] = (defaultValue || '00:00').split(':').map(Number);
  const hSel = document.getElementById('ev-'+prefix+'-h');
  const mSel = document.getElementById('ev-'+prefix+'-m');
  if(!hSel || !mSel) return;
  hSel.innerHTML = '';
  for(let h=0; h<24; h++){
    const opt = document.createElement('option');
    opt.value = String(h).padStart(2,'0');
    opt.textContent = String(h).padStart(2,'0');
    if(h === dh) opt.selected = true;
    hSel.appendChild(opt);
  }
  mSel.innerHTML = '';
  for(let m=0; m<60; m+=5){
    const opt = document.createElement('option');
    opt.value = String(m).padStart(2,'0');
    opt.textContent = String(m).padStart(2,'0');
    if(m === Math.round(dm/5)*5 % 60) opt.selected = true;
    mSel.appendChild(opt);
  }
  updateTimeDisplay(prefix);
}

function setTimeSelects(prefix, value){
  if(!value) return;
  const [h, m] = value.split(':').map(Number);
  const rounded = Math.round(m/5)*5 % 60;
  const hSel = document.getElementById('ev-'+prefix+'-h');
  const mSel = document.getElementById('ev-'+prefix+'-m');
  if(hSel) hSel.value = String(h).padStart(2,'0');
  if(mSel) mSel.value = String(rounded).padStart(2,'0');
  updateTimeDisplay(prefix);
}

function updateTimeDisplay(prefix){
  const h = document.getElementById('ev-'+prefix+'-h')?.value || '00';
  const m = document.getElementById('ev-'+prefix+'-m')?.value || '00';
  const disp = document.getElementById('ev-'+prefix+'-display');
  if(disp) disp.textContent = `${h}:${m}`;
}

// ── Drum builder ─────────────────────────────────────────────
function _buildDrum(drumEl, items, selectedIdx){
  drumEl.innerHTML = '';
  // spacer top
  const st = document.createElement('div');
  st.className = 'tp-drum-spacer';
  drumEl.appendChild(st);

  items.forEach((label, i)=>{
    const div = document.createElement('div');
    div.className = 'tp-drum-item';
    div.textContent = label;
    div.dataset.idx = i;
    drumEl.appendChild(div);
  });

  // spacer bottom
  const sb = document.createElement('div');
  sb.className = 'tp-drum-spacer';
  drumEl.appendChild(sb);

  // scroll to selected (instant)
  requestAnimationFrame(()=>{
    drumEl.scrollTop = selectedIdx * ITEM_H;
  });
}

function _drumGetCurrent(drumEl, itemCount){
  const raw = drumEl.scrollTop;
  let idx = Math.round(raw / ITEM_H);
  return Math.max(0, Math.min(itemCount - 1, idx));
}

function openTimePicker(prefix){
  _tpPrefix = prefix;
  const hSel = document.getElementById('ev-'+prefix+'-h');
  const mSel = document.getElementById('ev-'+prefix+'-m');
  _tpH = parseInt(hSel?.value || '9', 10);
  _tpM = parseInt(mSel?.value || '0', 10);

  document.getElementById('tp-modal-title').textContent =
    prefix === 'start' ? 'Ora di inizio' : 'Ora di fine';

  // Build hours drum (0-23)
  const hLabels = Array.from({length:24}, (_,i)=> String(i).padStart(2,'0'));
  _buildDrum(document.getElementById('tp-drum-h'), hLabels, _tpH);

  // Build minutes drum (0,5,10,...,55)
  const mVals = Array.from({length:12}, (_,i)=> i*5);
  const mLabels = mVals.map(v=> String(v).padStart(2,'0'));
  const mIdx = mVals.indexOf(Math.round(_tpM/5)*5 % 60);
  _buildDrum(document.getElementById('tp-drum-m'), mLabels, Math.max(0,mIdx));

  document.getElementById('tp-modal').classList.add('open');
}

function closeTimePicker(doSave){
  const drumH = document.getElementById('tp-drum-h');
  const drumM = document.getElementById('tp-drum-m');

  if(doSave && _tpPrefix){
    const hIdx = _drumGetCurrent(drumH, 24);
    const mIdx = _drumGetCurrent(drumM, 12);
    const h = String(hIdx).padStart(2,'0');
    const m = String(mIdx * 5).padStart(2,'0');
    const hSel = document.getElementById('ev-'+_tpPrefix+'-h');
    const mSel = document.getElementById('ev-'+_tpPrefix+'-m');
    if(hSel) hSel.value = h;
    if(mSel) mSel.value = m;
    updateTimeDisplay(_tpPrefix);
  }

  document.getElementById('tp-modal').classList.remove('open');
  _tpPrefix = null;
}

// Rotella mouse: scorra di un item alla volta
document.addEventListener('DOMContentLoaded', ()=>{
  ['tp-drum-h','tp-drum-m'].forEach(id=>{
    const drum = document.getElementById(id);

    drum.addEventListener('wheel', e=>{
      e.preventDefault();
      const dir = e.deltaY > 0 ? 1 : -1;
      const current = Math.round(drum.scrollTop / ITEM_H);
      drum.scrollTo({ top: (current + dir) * ITEM_H, behavior:'smooth' });
    }, { passive: false });
  });
});

async function saveEvent(){
  const title = document.getElementById('ev-title').value.trim();
  if(!title){ document.getElementById('ev-saving').textContent='Inserisci un titolo.'; return; }

  const allday   = document.getElementById('ev-allday').checked;
  const startDate= document.getElementById('ev-start-date').value;
  const endDate  = document.getElementById('ev-end-date').value;
  const startTime= getTimeValue('start');
  const endTime  = getTimeValue('end');
  const desc     = document.getElementById('ev-desc').value.trim();
  const calId    = document.getElementById('ev-cal').value;
  // selectedColorId is updated directly by the category swatch dropdown

  if(!startDate||!endDate){ document.getElementById('ev-saving').textContent='Inserisci le date.'; return; }

  document.getElementById('ev-saving').textContent = 'Salvataggio...';

  let eventBody;
  if(allday){
    // Fine esclusiva per eventi tutto-il-giorno
    const endExcl = new Date(endDate);
    endExcl.setDate(endExcl.getDate()+1);
    const endExclStr = endExcl.toISOString().slice(0,10);
    eventBody = {
      summary:     title,
      description: desc||undefined,
      colorId:     selectedColorId,
      start: { date: startDate },
      end:   { date: endExclStr },
    };
  } else {
    eventBody = {
      summary:     title,
      description: desc||undefined,
      colorId:     selectedColorId,
      start: { dateTime: `${startDate}T${startTime}:00`, timeZone:'Europe/Rome' },
      end:   { dateTime: `${endDate}T${endTime}:00`,   timeZone:'Europe/Rome' },
    };
  }

  try {
    if(currentEventId){
      await gapi.client.calendar.events.update({
        calendarId: currentCalendarId,
        eventId:    currentEventId,
        resource:   eventBody,
      });
    } else {
      await gapi.client.calendar.events.insert({
        calendarId: calId,
        resource:   eventBody,
      });
    }
    closePopup();
    await loadAllData();
    showToast(currentEventId ? 'Evento aggiornato' : 'Evento aggiunto');
  } catch(err){
    document.getElementById('ev-saving').textContent = 'Errore nel salvataggio.';
    console.error(err);
  }
}

async function deleteEvent(){
  if(!currentEventId) return;
  if(!confirm('Eliminare questo evento?')) return;
  document.getElementById('ev-saving').textContent = 'Eliminazione...';
  try {
    await gapi.client.calendar.events.delete({
      calendarId: currentCalendarId,
      eventId:    currentEventId,
    });
    closePopup();
    await loadAllData();
    showToast('Evento eliminato');
  } catch(err){
    document.getElementById('ev-saving').textContent = "Errore nell'eliminazione.";
  }
}


function openPickFromHstrips(dk, hstrips){
  const box=document.getElementById('pick-events');
  box.innerHTML='';
  hstrips.forEach(hs=>{
    const evid=hs.dataset.evid;
    const bg=hs.style.background||'#B0BEC5';
    const title=hs.querySelector('.hstrip-lbl')?.textContent||'(senza titolo)';
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid #eee;cursor:pointer';
    div.innerHTML=`<div style="width:12px;height:12px;border-radius:50%;flex-shrink:0;background:${bg}"></div><span style="font-size:14px;color:#1A1A18">${title}</span>`;
    div.addEventListener('click',()=>{ closePickPopup(); openPopup(dk, evid); });
    box.appendChild(div);
  });
  const popup=document.getElementById('pick-popup');
  popup.style.display='flex';
}

function closePickPopup(){
  const popup=document.getElementById('pick-popup');
  popup.style.display='none';
  document.getElementById('pick-events').innerHTML='';
}

document.addEventListener('DOMContentLoaded',()=>{
  const pp=document.getElementById('pick-popup');
  if(pp) pp.addEventListener('click',e=>{ if(e.target===pp) closePickPopup(); });
});

// ══════════════════════════════════════════════════════════════
// MENU
// ══════════════════════════════════════════════════════════════
function openMenu(){
  // Aggiorna la riga versione/autore ogni volta che si apre
  const vl = document.getElementById('menu-version-line');
  if(vl) vl.textContent = APP_VERSION + ' · Andrea Xotta';
  const overlay = document.getElementById('menu-overlay');
  overlay.classList.add('open');
  // Chiudi con tap sull'overlay esterno
  overlay.addEventListener('click', _menuOverlayClick);
}

function closeMenu(){
  const overlay = document.getElementById('menu-overlay');
  overlay.classList.remove('open');
  overlay.removeEventListener('click', _menuOverlayClick);
}

function _menuOverlayClick(e){
  if(e.target === document.getElementById('menu-overlay')) closeMenu();
}

function menuRefresh(){
  closeMenu();
  // Hard reload dal server (bypassa cache)
  window.location.reload(true);
}

function menuResetView(){
  closeMenu();
  windowStart = DEFAULT_START;
  windowSize  = getDefaultSize();
  loadAllData();
  showToast('Vista iniziale ripristinata');
}

function menuSetup(){
  closeMenu();
  showToast('Nessuna impostazione disponibile');
}

// Chiudi menu con Escape
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    const overlay = document.getElementById('menu-overlay');
    if(overlay && overlay.classList.contains('open')){ closeMenu(); }
  }
});

// ══════════════════════════════════════════════════════════════
// SERVICE WORKER
// ══════════════════════════════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
